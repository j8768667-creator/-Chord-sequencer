<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>ChordFlow Studio Pro</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2ff;background:#0b1020;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1020}
body{min-height:100svh;overscroll-behavior:none}
button,select,input{font:inherit}button,select{min-height:44px;touch-action:manipulation}
button{border:1px solid #293654;border-radius:14px;background:#151d31;color:#eef2ff;padding:0 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:scale(.97)}button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:#35b9f2;color:#07111c;border:0;font-weight:700}
button.success{background:#10b981;color:#042f22;border:0;font-weight:700}
button.danger{background:#3d1a24;color:#ff8080;border:1px solid #632838}
.app{min-height:100svh;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:1400px;margin:auto}
.panel{border:1px solid #293654;border-radius:20px;background:#11182a;padding:18px;margin-bottom:16px;box-shadow:0 8px 30px #0003}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0;font-size:28px}.top p{margin:4px 0 0;color:#9da8be}
.statuses{display:flex;gap:8px;flex-wrap:wrap}.status{padding:10px 14px;border-radius:999px;background:#1d273b;color:#aeb8cb;font-size:14px}
.controls{display:grid;grid-template-columns:repeat(3, 1fr) auto;gap:12px;align-items:end}
.controls-secondary{display:grid;grid-template-columns:repeat(4, 1fr);gap:12px;margin-top:12px;align-items:end}
label{display:grid;gap:6px;color:#9da8be;font-size:14px}select{background:#20202a;border:1px solid #39435a;border-radius:12px;padding:0 12px;color:#fff}
input[type=range]{width:100%;min-height:40px;accent-color:#35b9f2}
.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.heading h2{margin:0;font-size:20px}.heading p{margin:4px 0 0;color:#9da8be;font-size:14px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.preset{text-align:left;min-height:80px;padding:12px}.preset strong{display:block}.preset span{display:block;color:#aeb8cb;margin-top:4px;font-size:13px}.preset.selected{outline:2px solid #35b9f2;background:#18283a}
.arrangement{display:grid;gap:10px;margin-top:14px}.empty{color:#8e99ae;padding:24px;border:1px dashed #33405a;border-radius:14px;text-align:center}
.block{display:grid;grid-template-columns:36px 1fr auto auto auto;gap:10px;align-items:center;background:#182238;border:1px solid #2d3a55;border-radius:14px;padding:10px 14px}
.block .roman{font-weight:700;font-size:16px}.block .notes{color:#9da8be;font-size:13px;margin-top:2px}
.tracks>div{display:grid;grid-template-columns:130px 1fr 80px;gap:12px;align-items:center;margin:10px 0}.meter{height:8px;border-radius:8px;background:#24324c;overflow:hidden}.meter i{display:block;width:0;height:100%;background:#35b9f2;transition:width 0.1s}
.action-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.message{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,150%);background:#172238;border:1px solid #33405a;padding:12px 18px;border-radius:12px;transition:transform .2s;z-index:20;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.message.show{transform:translate(-50%,0)}
@media(max-width:1050px){.controls,.controls-secondary{grid-template-columns:1fr 1fr}.presets{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.controls,.controls-secondary,.presets{grid-template-columns:1fr}.tracks>div{grid-template-columns:90px 1fr 70px}.block{grid-template-columns:24px 1fr auto auto auto}}
</style>
</head>
<body>
<main class="app">
<header class="panel top">
  <div><h1>ChordFlow Studio Pro</h1><p>Expressive Voice-Leading & Validated MIDI Export Engine</p></div>
  <div class="statuses"><span id="audioStatus" class="status">Audio Locked</span><span id="playStatus" class="status">Stopped</span></div>
</header>

<section class="panel">
  <div class="controls">
    <label>Root Pitch<select id="rootKey">
      <option value="C">C</option><option value="C#">C# / Db</option><option value="D">D</option><option value="D#">D# / Eb</option>
      <option value="E">E</option><option value="F">F</option><option value="F#">F# / Gb</option><option value="G">G</option>
      <option value="G#">G# / Ab</option><option value="A">A</option><option value="A#">A# / Bb</option><option value="B">B</option>
    </select></label>

    <label>Scale / Mode<select id="scaleMode">
      <option value="major">Major (Ionian)</option>
      <option value="minor">Natural Minor (Aeolian)</option>
      <option value="dorian">Dorian Mode</option>
      <option value="mixolydian">Mixolydian Mode</option>
      <option value="lydian">Lydian Mode</option>
      <option value="phrygian">Phrygian Mode</option>
    </select></label>

    <label>Tempo (BPM) <span id="bpmText">96</span><input id="bpm" type="range" min="40" max="200" value="96"></label>
    <button id="audio" class="primary">Enable Audio</button>
  </div>

  <div class="controls-secondary">
    <label>Articulation Style<select id="articulation">
      <option value="legato">Lush Legato (Sustained Pads)</option>
      <option value="staccato">Natural Staccato (Keys)</option>
      <option value="strum">Acoustic Strum (Humanized)</option>
      <option value="arp">Arpeggiated (Dynamic Flow)</option>
    </select></label>

    <label>Arp Pattern<select id="arpPattern">
      <option value="up">Ascending (Up)</option>
      <option value="down">Descending (Down)</option>
      <option value="updown">Bounce (Up-Down)</option>
      <option value="random">Randomized</option>
    </select></label>

    <label>Humanization / Swing <span id="swingText">35%</span><input id="swing" type="range" min="0" max="80" value="35"></label>
    <label>Strum Velocity <span id="strumText">45ms</span><input id="strumSpeed" type="range" min="15" max="100" value="45"></label>
  </div>
</section>

<section class="panel">
  <div class="heading"><h2>Extended Harmonic Presets</h2></div>
  <div id="presets" class="presets"></div>
</section>

<section class="panel">
  <div class="heading">
    <div>
      <h2>Arrangement Timeline</h2>
      <p>Seamless voice-leading chord progression grid.</p>
    </div>
    <div class="action-group">
      <button id="inlinePlay" class="success" disabled>▶ Play Progression</button>
      <button id="inlineStop" class="danger">■ Stop</button>
      <button id="clearBtn">Clear Grid</button>
      <button id="importBtn">Import MIDI</button>
      <button id="exportBtn" class="primary">Export Validated MIDI</button>
      <input id="midiInput" type="file" accept=".mid,.midi" hidden>
    </div>
  </div>
  <div id="arrangement" class="arrangement"></div>
</section>

<section class="panel tracks">
  <div><span>01 Poly Keys</span><div class="meter"><i id="m0"></i></div><button data-track="0">Mute</button></div>
  <div><span>02 Bass Voice</span><div class="meter"><i id="m1"></i></div><button data-track="1">Mute</button></div>
  <div><span>03 Harmonic Mel</span><div class="meter"><i id="m2"></i></div><button data-track="2">Mute</button></div>
  <div><span>04 Percussion</span><div class="meter"><i id="m3"></i></div><button data-track="3">Mute</button></div>
</section>
<div id="message" class="message"></div>
</main>

<script>
(function(){
"use strict";

const CATALOG = [
  {name:"Neo-Soul Smooth 9ths", roman:["Imaj9","vi7","ii7","V11"]},
  {name:"Pop Emotional Flow", roman:["Iadd9","V/B","vi7","IVmaj7"]},
  {name:"Plagal Resolution", roman:["IVmaj7","I/G","IV/A","I"]},
  {name:"Lo-Fi Chill Hop", roman:["i7","iv7","bVImaj7","V7b9"]},
  {name:"Jazz-Hop Extended", roman:["ii7","V7alt","Imaj9","VI7b13"]},
  {name:"Soulful Minor Flow", roman:["i9","bVII6","bVImaj7","i7"]}
];

const ROOTS = {"C":0,"C#":1,"D":2,"D#":3,"E":4,"F":5,"F#":6,"G":7,"G#":8,"A":9,"A#":10,"B":11};
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const SCALES = {
  major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10],
  dorian:[0,2,3,5,7,9,10], mixolydian:[0,2,4,5,7,9,10],
  lydian:[0,2,4,6,7,9,11], phrygian:[0,1,3,5,7,8,10]
};
const DEG = {I:0,II:1,III:2,IV:3,V:4,VI:5,VII:6};

function $(id){ return document.getElementById(id); }

// UI Cache Variables
let uiStyle = "legato";
let uiArpDir = "up";
let uiSwingPct = 35 / 100.0;
let uiStrumSpeedMs = 45 / 1000.0;

/* ---------- Voice-Leading Engine ---------- */
function parseChordNotes(symbol, rootStr, scaleModeStr, prevChordPitches = null) {
  let pc = ROOTS[rootStr] !== undefined ? ROOTS[rootStr] : 0;
  const scale = SCALES[scaleModeStr] || SCALES.major;

  let raw = symbol, slashBass = null;
  if (raw.includes("/")) { const parts = raw.split("/"); raw = parts[0]; slashBass = parts[1]; }

  let accidental = 0;
  if (raw[0] === "b") { accidental = -1; raw = raw.slice(1); }
  else if (raw[0] === "#") { accidental = 1; raw = raw.slice(1); }

  let clean = raw.replace(/(add9|maj9|maj7|m7|11|alt|7b9|7b13|v7|5|sus4|sus2|7)/i, "");
  const isMinor = /^[iv]+/.test(clean);
  const degree = clean.toUpperCase() || "I";
  const idx = DEG[degree] !== undefined ? DEG[degree] : 0;

  const rootPC = (pc + scale[idx] + accidental + 120) % 12;
  let basePitch = 60 + rootPC;

  let intervals = [0, 4, 7];
  if (isMinor) intervals = [0, 3, 7];
  if (symbol.includes("5")) intervals = [0, 7];
  if (symbol.includes("sus2")) intervals = [0, 2, 7];
  if (symbol.includes("sus4")) intervals = [0, 5, 7];
  if (symbol.includes("7")) intervals.push(10);
  if (symbol.includes("maj7")) intervals[3] = 11;
  if (symbol.includes("add9") || symbol.includes("9")) intervals.push(14);

  let chordPitches = intervals.map(n => basePitch + n);

  if (prevChordPitches && prevChordPitches.length) {
    const targetMean = prevChordPitches.reduce((a, b) => a + b, 0) / prevChordPitches.length;
    chordPitches = chordPitches.map(p => {
      while (p - targetMean > 6) p -= 12;
      while (p - targetMean < -6) p += 12;
      return p;
    });
  } else {
    chordPitches = chordPitches.map(p => p > 72 ? p - 12 : p);
  }

  let bassPitch = basePitch - 24;
  if (slashBass) {
    let bassIdx = DEG[slashBass.toUpperCase()];
    if (bassIdx !== undefined) bassPitch = 36 + ((pc + scale[bassIdx] + 120) % 12);
  }

  return [bassPitch, ...chordPitches].sort((a,b)=>a-b);
}

/* ---------- App State ---------- */
let blocks = [], selectedId = null, audioCtx = null, master = null, reverbNode = null, muted = [false,false,false,false], bpm = 96;
let isPlaying = false, currentBeat = 0, nextNoteTime = 0.0, schedulerTimer = null;

function toast(t){ const m=$("message"); m.textContent=t; m.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>m.classList.remove("show"),2500); }

function renderPresets(){
  const box = $("presets"); box.replaceChildren();
  CATALOG.forEach((p, idx) => {
    const b = document.createElement("button"); b.className = "preset" + (idx === selectedId ? " selected" : "");
    const strong = document.createElement("strong"); strong.textContent = p.name;
    const span = document.createElement("span"); span.textContent = p.roman.join(" · ");
    b.append(strong, span);
    b.onclick = function(){ loadPreset(p, idx); };
    box.appendChild(b);
  });
}

function renderArrangement(){
  const box = $("arrangement"); box.replaceChildren();
  if(!blocks.length){
    box.className = "arrangement empty";
    box.textContent = "Grid empty. Choose a preset sequence, import MIDI, or start composing.";
    if ($("inlinePlay")) $("inlinePlay").disabled = true;
    return;
  }
  if ($("inlinePlay") && audioCtx) $("inlinePlay").disabled = false;
  box.className = "arrangement";
  blocks.forEach((b, i) => {
    const row = document.createElement("div"); row.className = "block";
    const n = document.createElement("span"); n.textContent = i + 1;
    const info = document.createElement("div");
    const r = document.createElement("div"); r.className = "roman"; r.textContent = b.roman;
    const notes = document.createElement("div"); notes.className = "notes"; notes.textContent = "Pitches: " + b.notes.join(", ");
    info.append(r, notes);
    const up = document.createElement("button"); up.textContent = "↑"; up.disabled = (i === 0);
    up.onclick = function(){ [blocks[i-1], blocks[i]] = [blocks[i], blocks[i-1]]; revoiceAll(); renderArrangement(); };
    const down = document.createElement("button"); down.textContent = "↓"; down.disabled = (i === blocks.length - 1);
    down.onclick = function(){ [blocks[i+1], blocks[i]] = [blocks[i], blocks[i+1]]; revoiceAll(); renderArrangement(); };
    const del = document.createElement("button"); del.textContent = "✕";
    del.onclick = function(){ blocks.splice(i, 1); revoiceAll(); renderArrangement(); };
    row.append(n, info, up, down, del);
    box.append(row);
  });
}

function revoiceAll(){
  let prev = null;
  blocks = blocks.map(b => {
    if (b.imported) return b;
    const notes = parseChordNotes(b.roman, $("rootKey").value, $("scaleMode").value, prev);
    prev = notes.slice(1);
    return { ...b, notes };
  });
}

function loadPreset(p, id){
  selectedId = id;
  let prev = null;
  blocks = p.roman.map((r, i) => {
    const notes = parseChordNotes(r, $("rootKey").value, $("scaleMode").value, prev);
    prev = notes.slice(1);
    return { roman: r, notes, index: i };
  });
  renderPresets(); renderArrangement();
  if (audioCtx) $("inlinePlay").disabled = false;
  toast("Loaded: " + p.name);
}

function clearTimeline(){
  stop();
  blocks = []; selectedId = null;
  renderPresets(); renderArrangement();
  toast("Grid Cleared!");
}

/* ---------- Binary Stream MIDI Writer ---------- */
class BinaryWriter {
  constructor() {
    this.buffer = [];
  }
  writeByte(b) {
    this.buffer.push(b & 0xFF);
  }
  writeBytes(arr) {
    for (let i = 0; i < arr.length; i++) this.writeByte(arr[i]);
  }
  writeString(str) {
    for (let i = 0; i < str.length; i++) this.writeByte(str.charCodeAt(i));
  }
  writeUInt16(val) {
    this.writeByte((val >> 8) & 0xFF);
    this.writeByte(val & 0xFF);
  }
  writeUInt32(val) {
    this.writeByte((val >> 24) & 0xFF);
    this.writeByte((val >> 16) & 0xFF);
    this.writeByte((val >> 8) & 0xFF);
    this.writeByte(val & 0xFF);
  }
  writeVarInt(val) {
    let buffer = [val & 0x7F];
    while ((val >>= 7) > 0) {
      buffer.unshift((val & 0x7F) | 0x80);
    }
    this.writeBytes(buffer);
  }
  getBytes() {
    return new Uint8Array(this.buffer);
  }
}

function exportMIDIFile() {
  if (!blocks.length) { toast("No progression to export!"); return; }

  const ppq = 480;
  const chordDurationTicks = ppq * 4; // 1 bar (4 beats) per chord

  const track = new BinaryWriter();

  // 1. Set Tempo Meta Event (Delta Time = 0)
  const mpqn = Math.round(60000000 / bpm);
  track.writeVarInt(0);
  track.writeByte(0xFF);
  track.writeByte(0x51);
  track.writeByte(0x03);
  track.writeByte((mpqn >> 16) & 0xFF);
  track.writeByte((mpqn >> 8) & 0xFF);
  track.writeByte(mpqn & 0xFF);

  // 2. Program Change - Acoustic Grand Piano (Delta Time = 0)
  track.writeVarInt(0);
  track.writeByte(0xC0);
  track.writeByte(0x00);

  // 3. Generate Sequence Events
  blocks.forEach((b) => {
    const notes = b.notes;

    // Note On for all chord pitches
    notes.forEach((pitch, i) => {
      track.writeVarInt(0); // Play simultaneously
      track.writeByte(0x90);
      track.writeByte(pitch & 0x7F);
      track.writeByte(0x64); // Velocity 100
    });

    // Note Off for all chord pitches
    notes.forEach((pitch, i) => {
      // Delta time of full bar applied to first Note Off, subsequent ones delta = 0
      track.writeVarInt(i === 0 ? chordDurationTicks : 0);
      track.writeByte(0x80);
      track.writeByte(pitch & 0x7F);
      track.writeByte(0x00);
    });
  });

  // 4. End of Track Meta Event
  track.writeVarInt(0);
  track.writeByte(0xFF);
  track.writeByte(0x2F);
  track.writeByte(0x00);

  const trackData = track.getBytes();

  // Assemble Standard Format 0 Header
  const header = new BinaryWriter();
  header.writeString("MThd");
  header.writeUInt32(6); // Header length
  header.writeUInt16(0); // Format 0
  header.writeUInt16(1); // 1 Track
  header.writeUInt16(ppq); // PPQ Division

  header.writeString("MTrk");
  header.writeUInt32(trackData.length);

  const finalBuffer = new Uint8Array(header.getBytes().length + trackData.length);
  finalBuffer.set(header.getBytes(), 0);
  finalBuffer.set(trackData, header.getBytes().length);

  const blob = new Blob([finalBuffer], { type: "audio/midi" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "ChordFlow_Validated.mid";
  a.click();
  URL.revokeObjectURL(url);
  toast("Standard MIDI File Exported!");
}

function parseMIDIFile(arrayBuffer) {
  const data = new DataView(arrayBuffer);
  let offset = 0;

  function readString(len) {
    let str = "";
    for (let i = 0; i < len; i++) str += String.fromCharCode(data.getUint8(offset++));
    return str;
  }

  if (readString(4) !== "MThd") { toast("Invalid MIDI File Format!"); return; }
  offset += 4;
  offset += 2; // skip format
  const tracksCount = data.getUint16(offset); offset += 2;
  const division = data.getUint16(offset); offset += 2;

  let allNotes = [];

  for (let track = 0; track < tracksCount; track++) {
    if (offset >= data.byteLength) break;
    if (readString(4) !== "MTrk") break;
    const trackLen = data.getUint32(offset); offset += 4;
    const trackEnd = offset + trackLen;

    let absoluteTicks = 0;
    let runningStatus = 0;

    while (offset < trackEnd) {
      let delta = 0;
      while (true) {
        let byte = data.getUint8(offset++);
        delta = (delta << 7) | (byte & 0x7F);
        if (!(byte & 0x80)) break;
      }
      absoluteTicks += delta;

      let status = data.getUint8(offset);
      if (status & 0x80) {
        runningStatus = status;
        offset++;
      } else {
        status = runningStatus;
      }

      const command = status & 0xF0;
      if (command === 0x90) {
        const pitch = data.getUint8(offset++);
        const vel = data.getUint8(offset++);
        if (vel > 0) allNotes.push({ pitch, ticks: absoluteTicks });
      } else if (command === 0x80) {
        offset += 2;
      } else if (status === 0xFF) {
        offset++;
        let metaLen = 0;
        while (true) {
          let b = data.getUint8(offset++);
          metaLen = (metaLen << 7) | (b & 0x7F);
          if (!(b & 0x80)) break;
        }
        offset += metaLen;
      } else {
        offset += 2;
      }
    }
  }

  if (!allNotes.length) { toast("No valid note events found."); return; }

  allNotes.sort((a,b) => a.ticks - b.ticks);
  let parsedBlocks = [], currentGroup = [], lastTicks = -1;

  allNotes.forEach(n => {
    if (lastTicks < 0 || Math.abs(n.ticks - lastTicks) < (division / 3)) {
      currentGroup.push(n.pitch);
    } else {
      if (currentGroup.length) {
        const unique = Array.from(new Set(currentGroup)).sort((a,b)=>a-b);
        const rootNoteName = NOTE_NAMES[unique[0] % 12];
        parsedBlocks.push({ roman: "Imported (" + rootNoteName + ")", notes: unique, imported: true });
      }
      currentGroup = [n.pitch];
    }
    lastTicks = n.ticks;
  });

  if (currentGroup.length) {
    const unique = Array.from(new Set(currentGroup)).sort((a,b)=>a-b);
    const rootNoteName = NOTE_NAMES[unique[0] % 12];
    parsedBlocks.push({ roman: "Imported (" + rootNoteName + ")", notes: unique, imported: true });
  }

  blocks = parsedBlocks;
  renderArrangement();
  toast("Imported " + blocks.length + " Chords!");
}

/* ---------- Audio Synth Engine ---------- */
function createReverbImpulse(ctx) {
  const rate = ctx.sampleRate, length = rate * 2.0, impulse = ctx.createBuffer(2, length, rate);
  for (let c = 0; c < 2; c++) {
    const data = impulse.getChannelData(c);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.2);
    }
  }
  return impulse;
}

async function enableAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) throw Error("Web Audio API not supported.");
    if(!audioCtx){
      audioCtx = new AC();
      master = audioCtx.createGain(); master.gain.value = 0.7;
      
      reverbNode = audioCtx.createConvolver();
      reverbNode.buffer = createReverbImpulse(audioCtx);
      const wetGain = audioCtx.createGain(); wetGain.gain.value = 0.22;
      
      reverbNode.connect(wetGain); wetGain.connect(audioCtx.destination);
      master.connect(audioCtx.destination); master.connect(reverbNode);
    }
    if(audioCtx.state !== "running") await audioCtx.resume();
    $("audioStatus").textContent = "Audio Active"; $("audio").textContent = "Audio Ready"; $("audio").disabled = true;
    if (blocks.length) $("inlinePlay").disabled = false;
    toast("Audio Engine Ready");
  }catch(e){ toast(e.message); }
}

function hz(n){ return 440 * Math.pow(2, (n - 69) / 12); }

function playPolyNote(note, time, dur, velocity=0.7, style="legato") {
  if (!audioCtx || muted[0]) return;
  const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
  const filter = audioCtx.createBiquadFilter(), gain = audioCtx.createGain();

  time = Math.max(audioCtx.currentTime, time);

  let attack = 0.015, cutoff = 2200;
  if (style === "staccato") { dur = Math.min(dur, 0.2); attack = 0.003; cutoff = 2800; }
  else if (style === "strum") { attack = 0.008; cutoff = 2400; }
  else if (style === "arp") { attack = 0.005; cutoff = 2300; }

  o1.type = "sine"; o1.frequency.setValueAtTime(hz(note), time);
  o2.type = "triangle"; o2.frequency.setValueAtTime(hz(note) * 2, time);

  filter.type = "lowpass";
  filter.frequency.setValueAtTime(cutoff * velocity, time);
  filter.frequency.exponentialRampToValueAtTime(250, time + dur);

  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.linearRampToValueAtTime(0.14 * velocity, time + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

  o1.connect(filter); o2.connect(filter);
  filter.connect(gain); gain.connect(master);

  o1.start(time); o2.start(time);
  o1.stop(time + dur + 0.05); o2.stop(time + dur + 0.05);
}

function playSubBass(note, time, dur, velocity=0.8) {
  if (!audioCtx || muted[1]) return;
  const sub = audioCtx.createOscillator(), gain = audioCtx.createGain();
  sub.type = "sine";
  sub.frequency.setValueAtTime(hz(note), time);

  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.linearRampToValueAtTime(0.25 * velocity, time + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

  sub.connect(gain); gain.connect(master);
  sub.start(time); sub.stop(time + dur + 0.05);
}

function playPercussion(time, velocity=0.7) {
  if (!audioCtx || muted[3]) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(110, time);
  osc.frequency.exponentialRampToValueAtTime(28, time + 0.12);
  gain.gain.setValueAtTime(0.3 * velocity, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.13);
  osc.connect(gain).connect(master);
  osc.start(time); osc.stop(time + 0.14);
}

function triggerMeter(idx){
  const el = $("m" + idx); el.style.width = "100%";
  setTimeout(() => el.style.width = "0", 120);
}

/* ---------- Sequencer ---------- */
function scheduleBeat(beatIndex, time){
  if (!blocks.length) return;
  const totalBeats = blocks.length * 4;
  const currentBlockIdx = Math.floor((beatIndex % totalBeats) / 4);
  const blockBeat = beatIndex % 4;
  const block = blocks[currentBlockIdx];
  const spb = 60.0 / bpm;

  const style = uiStyle;
  const arpDir = uiArpDir;
  const swingPct = uiSwingPct;
  const strumSpeedMs = uiStrumSpeedMs;

  let swingOffset = (blockBeat % 1 !== 0) ? (spb * 0.5) * (swingPct * 0.4) : 0;
  const adjustedTime = time + swingOffset;

  const chordPitches = block.notes.slice(1);
  const bassPitch = block.notes[0] || (chordPitches[0] ? chordPitches[0] - 24 : 36);
  const isAccent = (blockBeat === 0 || blockBeat === 2);
  const baseVelocity = isAccent ? 0.85 : 0.62;

  if (style === "arp") {
    let pitchList = [...chordPitches];
    if (arpDir === "down") pitchList.reverse();
    else if (arpDir === "updown") pitchList = pitchList.concat([...pitchList].reverse().slice(1,-1));
    else if (arpDir === "random") pitchList.sort(() => Math.random() - 0.5);

    for (let sub = 0; sub < 4; sub++) {
      const subTime = adjustedTime + (sub * (spb / 4));
      const subVel = (sub === 0) ? baseVelocity : baseVelocity * 0.7;
      const pitch = pitchList[(Math.floor(beatIndex * 4) + sub) % pitchList.length];
      if (pitch) playPolyNote(pitch, subTime, spb * 0.35, subVel, "arp");
    }
    triggerMeter(0);

  } else if (style === "strum") {
    if (isAccent) {
      const strumedNotes = (blockBeat === 2) ? [...chordPitches].reverse() : chordPitches;
      strumedNotes.forEach((n, idx) => {
        const strumDelay = Math.pow(idx, 1.1) * strumSpeedMs;
        playPolyNote(n, adjustedTime + strumDelay, spb * 1.8, baseVelocity, "strum");
      });
      triggerMeter(0);
    }

  } else if (style === "staccato") {
    if (blockBeat % 1 === 0) {
      chordPitches.forEach((n) => playPolyNote(n, adjustedTime, spb * 0.2, baseVelocity, "staccato"));
      triggerMeter(0);
    }

  } else {
    if (blockBeat === 0) {
      chordPitches.forEach((n, idx) => playPolyNote(n, adjustedTime + (idx * 0.012), spb * 3.8, baseVelocity, "legato"));
      triggerMeter(0);
    }
  }

  if (blockBeat === 0 || blockBeat === 2.5) {
    playSubBass(bassPitch, adjustedTime, spb * 1.6, baseVelocity);
    triggerMeter(1);
  }

  if (isAccent) playPercussion(adjustedTime, baseVelocity);
  triggerMeter(3);

  setTimeout(() => {
    $("playStatus").textContent = "Playing Block " + (currentBlockIdx + 1) + "/" + blocks.length;
  }, (time - audioCtx.currentTime) * 1000);
}

function scheduler(){
  while(nextNoteTime < audioCtx.currentTime + 0.1){
    scheduleBeat(currentBeat, nextNoteTime);
    nextNoteTime += (60.0 / bpm);
    currentBeat++;
  }
  schedulerTimer = window.setTimeout(scheduler, 25);
}

function start(){
  if(!audioCtx || audioCtx.state !== "running"){ toast("Enable Audio Engine first!"); return; }
  if(!blocks.length){ toast("Load or import a progression grid first!"); return; }
  stop();
  isPlaying = true; currentBeat = 0;
  nextNoteTime = audioCtx.currentTime + 0.05;
  scheduler();
}

function stop(){
  if(schedulerTimer) clearTimeout(schedulerTimer);
  isPlaying = false; $("playStatus").textContent = "Stopped";
}

/* ---------- Setup Controls ---------- */
$("audio").onclick = enableAudio;
$("inlinePlay").onclick = start;
$("inlineStop").onclick = stop;
$("clearBtn").onclick = clearTimeline;
$("exportBtn").onclick = exportMIDIFile;
$("importBtn").onclick = () => $("midiInput").click();
$("midiInput").onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => parseMIDIFile(evt.target.result);
  reader.readAsArrayBuffer(file);
};

$("rootKey").onchange = function(){ revoiceAll(); renderArrangement(); };
$("scaleMode").onchange = function(){ revoiceAll(); renderArrangement(); };
$("bpm").oninput = function(){ bpm = Number(this.value); $("bpmText").textContent = bpm; };
$("swing").oninput = function(){
  $("swingText").textContent = this.value + "%";
  uiSwingPct = Number(this.value) / 100.0;
};
$("strumSpeed").oninput = function(){
  $("strumText").textContent = this.value + "ms";
  uiStrumSpeedMs = Number(this.value) / 1000.0;
};
$("articulation").onchange = function(){ uiStyle = this.value; };
$("arpPattern").onchange = function(){ uiArpDir = this.value; };

// Initialize variables with current DOM values
uiStyle = $("articulation").value;
uiArpDir = $("arpPattern").value;
uiSwingPct = Number($("swing").value) / 100.0;
uiStrumSpeedMs = Number($("strumSpeed").value) / 1000.0;

document.querySelectorAll(".tracks button").forEach(b => b.onclick = function(){
  const i = Number(this.dataset.track); muted[i] = !muted[i]; this.textContent = muted[i] ? "Unmute" : "Mute";
});

window.addEventListener("pagehide", stop);
renderPresets(); renderArrangement();
})();
</script>
</body>
