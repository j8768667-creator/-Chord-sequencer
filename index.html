<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>ChordFlow Studio Pro</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2ff;background:#0b1020;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1020}
body{min-height:100svh;overscroll-behavior:none}
button,select,input{font:inherit}button,select{min-height:48px;touch-action:manipulation}
button{border:1px solid #293654;border-radius:16px;background:#151d31;color:#eef2ff;padding:0 18px;cursor:pointer}
button:active{transform:scale(.98)}button:disabled{opacity:.42;cursor:not-allowed}
button.primary{background:#35b9f2;color:#07111c;border:0;font-weight:700}
button.danger{background:#3d1a24;color:#ff8080;border:1px solid #632838}
.app{min-height:100svh;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:1500px;margin:auto}
.panel{border:1px solid #293654;border-radius:22px;background:#11182a;padding:18px;margin-bottom:16px;box-shadow:0 8px 30px #0003}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0;font-size:30px}.top p{margin:4px 0 0;color:#9da8be}
.statuses{display:flex;gap:8px;flex-wrap:wrap}.status{padding:12px 15px;border-radius:999px;background:#1d273b;color:#aeb8cb}
.controls{display:grid;grid-template-columns:repeat(3, 1fr) auto auto;gap:12px;align-items:end}
.controls-secondary{display:grid;grid-template-columns:repeat(4, 1fr);gap:12px;margin-top:12px;align-items:end}
label{display:grid;gap:7px;color:#9da8be}select{background:#20202a;border:1px solid #39435a;border-radius:15px;padding:0 12px;color:#fff}
input[type=range]{width:100%;min-height:48px;accent-color:#35b9f2}
.heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.heading h2{margin:0;font-size:20px}.heading p{margin:5px 0 0;color:#9da8be}
.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}
.preset{text-align:left;min-height:90px;padding:15px}.preset strong{display:block}.preset span{display:block;color:#aeb8cb;margin-top:6px;font-size:14px}.preset.selected{outline:2px solid #35b9f2;background:#18283a}
.arrangement{display:grid;gap:10px;margin-top:15px}.empty{color:#8e99ae;padding:20px;border:1px dashed #33405a;border-radius:16px}
.block{display:grid;grid-template-columns:40px 1fr auto auto auto;gap:10px;align-items:center;background:#182238;border:1px solid #2d3a55;border-radius:16px;padding:10px}
.block .roman{font-weight:700}.block .notes{color:#9da8be;font-size:13px;margin-top:4px}
.tracks>div{display:grid;grid-template-columns:120px 1fr 80px;gap:12px;align-items:center;margin:12px 0}.meter{height:10px;border-radius:10px;background:#24324c;overflow:hidden}.meter i{display:block;width:0;height:100%;background:#35b9f2}
.action-group{display:flex;gap:8px;align-items:center}
.message{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,150%);background:#172238;border:1px solid #33405a;padding:13px 18px;border-radius:14px;transition:transform .2s;z-index:20;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.message.show{transform:translate(-50%,0)}
@media(max-width:1050px){.controls,.controls-secondary{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.top{align-items:flex-start;flex-direction:column}.controls,.controls-secondary{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}.tracks>div{grid-template-columns:85px 1fr 76px}.block{grid-template-columns:30px 1fr auto auto auto}.action-group{flex-wrap:wrap}}
</style>
</head>
<body>
<main class="app">
<header class="panel top">
  <div><h1>ChordFlow Studio Pro</h1><p>DAW-Compatible MIDI Engine with Dynamic Articulation</p></div>
  <div class="statuses"><span id="audioStatus" class="status">Audio Locked</span><span id="playStatus" class="status">Stopped</span></div>
</header>

<section class="panel">
  <div class="controls">
    <label>Root Pitch<select id="rootKey">
      <option value="C">C</option><option value="C#">C# / Db</option><option value="D">D</option><option value="D#">D# / Eb</option>
      <option value="E">E</option><option value="F">F</option><option value="F#">F# / Gb</option><option value="G">G</option>
      <option value="G#">G# / Ab</option><option value="A">A</option><option value="A#">A# / Bb</option><option value="B">B</option>
    </select></label>

    <label>Scale / Mode<select id="scaleMode">
      <option value="major">Major (Ionian)</option>
      <option value="minor">Natural Minor (Aeolian)</option>
      <option value="dorian">Dorian Mode</option>
      <option value="mixolydian">Mixolydian Mode</option>
      <option value="lydian">Lydian Mode</option>
      <option value="phrygian">Phrygian Mode</option>
    </select></label>

    <label>Tempo (BPM) <span id="bpmText">96</span><input id="bpm" type="range" min="40" max="200" value="96"></label>
    <button id="audio" class="primary">Enable Audio</button>
    <button id="play" disabled>Play Mix</button>
    <button id="stop">Stop</button>
  </div>

  <div class="controls-secondary">
    <label>Articulation Style<select id="articulation">
      <option value="legato">Lush Legato (Sustained Pads)</option>
      <option value="staccato">Natural Staccato (Keys)</option>
      <option value="strum">Acoustic Strum (Humanized)</option>
      <option value="arp">Arpeggiated (Dynamic Flow)</option>
    </select></label>

    <label>Arp Direction<select id="arpPattern">
      <option value="up">Ascending (Up)</option>
      <option value="down">Descending (Down)</option>
      <option value="updown">Bounce (Up-Down)</option>
      <option value="random">Randomized</option>
    </select></label>

    <label>Humanization / Swing <span id="swingText">35%</span><input id="swing" type="range" min="0" max="80" value="35"></label>
    <label>Strum Speed <span id="strumText">45ms</span><input id="strumSpeed" type="range" min="15" max="100" value="45"></label>
  </div>
</section>

<section class="panel">
  <div class="heading"><h2>Extended Sequences</h2><button id="random">Randomize</button></div>
  <div id="presets" class="presets"></div>
</section>

<section class="panel">
  <div class="heading">
    <div><h2>Arrangement Timeline</h2><p>Auto-voiced progression timeline.</p></div>
    <div class="action-group">
      <button id="clearBtn" class="danger">Clear Chords</button>
      <button id="importBtn">Import MIDI</button>
      <button id="exportBtn">Export MIDI</button>
      <input id="midiInput" type="file" accept=".mid,.midi" hidden>
    </div>
  </div>
  <div id="arrangement" class="arrangement"></div>
</section>

<section class="panel tracks">
  <div><span>01 Keys/Chords</span><div class="meter"><i id="m0"></i></div><button data-track="0">Mute</button></div>
  <div><span>02 Sub Bass</span><div class="meter"><i id="m1"></i></div><button data-track="1">Mute</button></div>
  <div><span>03 Melody</span><div class="meter"><i id="m2"></i></div><button data-track="2">Mute</button></div>
  <div><span>04 Percussion</span><div class="meter"><i id="m3"></i></div><button data-track="3">Mute</button></div>
</section>
<div id="message" class="message"></div>
</main>

<script>
(function(){
"use strict";

const CATALOG={
 pop:[
   {name:"Neo-Soul Smooth 9ths", roman:["Imaj9","vi7","ii7","V11"]},
   {name:"Pop Emotional Flow", roman:["Iadd9","V/B","vi7","IVmaj7"]},
   {name:"Plagal Resolution", roman:["IVmaj7","I/G","IV/A","I"]}
 ],
 hiphop:[
   {name:"Lo-Fi Chill Hop", roman:["i7","iv7","bVImaj7","V7b9"]},
   {name:"Jazz-Hop Extended", roman:["ii7","V7alt","Imaj9","VI7b13"]},
   {name:"Soulful Minor Flow", roman:["i9","bVII6","bVImaj7","i7"]}
 ]
};

const ROOTS={"C":0,"C#":1,"D":2,"D#":3,"E":4,"F":5,"F#":6,"G":7,"G#":8,"A":9,"A#":10,"B":11};
const NOTE_NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const SCALES={
  major:[0,2,4,5,7,9,11],
  minor:[0,2,3,5,7,8,10],
  dorian:[0,2,3,5,7,9,10],
  mixolydian:[0,2,4,5,7,9,10],
  lydian:[0,2,4,6,7,9,11],
  phrygian:[0,1,3,5,7,8,10]
};
const DEG={I:0,II:1,III:2,IV:3,V:4,VI:5,VII:6};

function $(id){return document.getElementById(id)}

/* ---------- Voice-Leading Engine ---------- */
function parseChordNotes(symbol, rootStr, scaleModeStr, lastNotes=null) {
  let pc = ROOTS[rootStr] !== undefined ? ROOTS[rootStr] : 0;
  const scale = SCALES[scaleModeStr] || SCALES.major;

  let raw = symbol, slashBass = null;
  if (raw.includes("/")) { const parts = raw.split("/"); raw = parts[0]; slashBass = parts[1]; }

  let accidental = 0;
  if (raw[0] === "b") { accidental = -1; raw = raw.slice(1); }
  else if (raw[0] === "#") { accidental = 1; raw = raw.slice(1); }

  let clean = raw.replace(/(add9|maj9|maj7|m7|11|alt|7b9|7b13|v7|5|sus4|sus2|7)/i, "");
  const isMinor = /^[iv]+/.test(clean);
  const degree = clean.toUpperCase() || "I";
  const idx = DEG[degree] !== undefined ? DEG[degree] : 0;

  const rootPC = (pc + scale[idx] + accidental + 120) % 12;
  let basePitch = 60 + rootPC;

  let intervals = [0, 4, 7];
  if (isMinor) intervals = [0, 3, 7];
  if (symbol.includes("5")) intervals = [0, 7];
  if (symbol.includes("sus2")) intervals = [0, 2, 7];
  if (symbol.includes("sus4")) intervals = [0, 5, 7];
  if (symbol.includes("7")) intervals.push(isMinor ? 10 : 10);
  if (symbol.includes("maj7")) intervals[3] = 11;
  if (symbol.includes("add9") || symbol.includes("9")) intervals.push(14);

  let rawNotes = intervals.map(n => basePitch + n);

  if (lastNotes && lastNotes.length) {
    const targetMean = lastNotes.reduce((a,b)=>a+b,0)/lastNotes.length;
    rawNotes = rawNotes.map(p => {
      while (p - targetMean > 6) p -= 12;
      while (p - targetMean < -6) p += 12;
      return p;
    });
  } else {
    rawNotes = rawNotes.map(p => p > 72 ? p - 12 : p);
  }

  if (slashBass) {
    let bassIdx = DEG[slashBass.toUpperCase()];
    if (bassIdx !== undefined) {
      let bassPC = (pc + scale[bassIdx] + 120) % 12;
      rawNotes.unshift(36 + bassPC);
    }
  } else {
    rawNotes.unshift(basePitch - 24);
  }

  return rawNotes.sort((a,b)=>a-b);
}

/* ---------- State ---------- */
let blocks=[], selectedId=null, audioCtx=null, master=null, reverbNode=null, muted=[false,false,false,false], bpm=96;
let isPlaying=false, currentBeat=0, nextNoteTime=0.0, schedulerTimer=null;

function toast(t){const m=$("message");m.textContent=t;m.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>m.classList.remove("show"),2500)}

function renderPresets(){
  const box=$("presets");box.replaceChildren();
  (CATALOG.pop).concat(CATALOG.hiphop).forEach((p, idx)=>{
    const b=document.createElement("button");b.className="preset"+(idx===selectedId?" selected":"");
    const strong=document.createElement("strong");strong.textContent=p.name;
    const span=document.createElement("span");span.textContent=p.roman.join(" · ");
    b.append(strong,span);b.onclick=function(){loadPreset(p, idx)};box.appendChild(b);
  });
}

function renderArrangement(){
  const box=$("arrangement");box.replaceChildren();
  if(!blocks.length){
    box.className="arrangement empty";
    box.textContent="Timeline empty. Choose a sequence above, import MIDI, or start creating.";
    if ($("play")) $("play").disabled = true;
    return;
  }
  if ($("play") && audioCtx) $("play").disabled = false;
  box.className="arrangement";
  blocks.forEach((b,i)=>{
    const row=document.createElement("div");row.className="block";
    const n=document.createElement("span");n.textContent=i+1;
    const info=document.createElement("div");
    const r=document.createElement("div");r.className="roman";r.textContent=b.roman;
    const notes=document.createElement("div");notes.className="notes";notes.textContent="MIDI Pitches: "+b.notes.join(", ");
    info.append(r,notes);
    const up=document.createElement("button");up.textContent="↑";up.disabled=i===0;up.onclick=function(){[blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]];revoiceAll();renderArrangement()};
    const down=document.createElement("button");down.textContent="↓";down.disabled=i===blocks.length-1;down.onclick=function(){[blocks[i+1],blocks[i]]=[blocks[i],blocks[i+1]];revoiceAll();renderArrangement()};
    const del=document.createElement("button");del.textContent="✕";del.onclick=function(){blocks.splice(i,1);revoiceAll();renderArrangement()};
    row.append(n,info,up,down,del);box.append(row);
  });
}

function revoiceAll(){
  let last = null;
  blocks = blocks.map(b => {
    if (b.imported) return b;
    const notes = parseChordNotes(b.roman, $("rootKey").value, $("scaleMode").value, last);
    last = notes.slice(1);
    return { ...b, notes };
  });
}

function loadPreset(p, id){
  selectedId=id;
  let last = null;
  blocks=p.roman.map((r,i)=>{
    const notes = parseChordNotes(r, $("rootKey").value, $("scaleMode").value, last);
    last = notes.slice(1);
    return {roman:r, notes, index:i};
  });
  renderPresets();renderArrangement();$("play").disabled=!audioCtx;toast("Loaded: "+p.name);
}

function clearTimeline() {
  stop();
  blocks = [];
  selectedId = null;
  renderPresets();
  renderArrangement();
  toast("Arrangement timeline cleared!");
}

/* ---------- Standard Formatted MIDI Export & Import ---------- */
function encodeVarInt(value) {
  let buffer = [];
  let num = value;
  while (true) {
    buffer.unshift(num & 0x7F);
    num >>= 7;
    if (num <= 0) break;
  }
  for (let i = 0; i < buffer.length - 1; i++) {
    buffer[i] |= 0x80;
  }
  return buffer;
}

function exportMIDIFile() {
  if (!blocks.length) { toast("No timeline blocks to export!"); return; }

  const ppq = 480;
  let trackEvents = [];

  // Meta Tempo Event
  const mpqn = Math.round(60000000 / bpm);
  trackEvents.push(0x00, 0xFF, 0x51, 0x03, (mpqn >> 16) & 0xFF, (mpqn >> 8) & 0xFF, mpqn & 0xFF);

  // DAW Initializer Controllers (CC 7 Channel Volume = 100, CC 10 Pan = 64)
  trackEvents.push(0x00, 0xB0, 0x07, 0x64);
  trackEvents.push(0x00, 0xB0, 0x0A, 0x40);

  // Write Chords with Correct Variable Length Deltas
  const chordTicks = ppq * 4;
  blocks.forEach((b) => {
    const notes = b.notes;
    notes.forEach((pitch, idx) => {
      const delta = (idx === 0) ? 0 : 0;
      trackEvents.push(...encodeVarInt(delta), 0x90, pitch, 0x60);
    });

    notes.forEach((pitch, idx) => {
      const delta = (idx === 0) ? chordTicks : 0;
      trackEvents.push(...encodeVarInt(delta), 0x80, pitch, 0x00);
    });
  });

  // End of Track Meta Event
  trackEvents.push(0x00, 0xFF, 0x2F, 0x00);

  // Binary Chunk Formatting
  const header = [
    0x4D, 0x74, 0x68, 0x64, // MThd
    0x00, 0x00, 0x00, 0x06,
    0x00, 0x00,             // Type 0
    0x00, 0x01,             // 1 Track
    (ppq >> 8) & 0xFF, ppq & 0xFF
  ];

  const tLen = trackEvents.length;
  const trackHeader = [
    0x4D, 0x74, 0x72, 0x6B, // MTrk
    (tLen >> 24) & 0xFF,
    (tLen >> 16) & 0xFF,
    (tLen >> 8) & 0xFF,
    tLen & 0xFF
  ];

  const midiBuffer = new Uint8Array([...header, ...trackHeader, ...trackEvents]);
  const blob = new Blob([midiBuffer], { type: "audio/midi" });
  const url = URL.createObjectURL(blob);
  
  const a = document.createElement("a");
  a.href = url;
  a.download = "ChordFlow_DAW_Ready.mid";
  a.click();
  URL.revokeObjectURL(url);
  toast("MIDI Exported - DAW Compatible!");
}

function parseMIDIFile(arrayBuffer) {
  const data = new DataView(arrayBuffer);
  let offset = 0;

  function readString(len) {
    let str = "";
    for (let i = 0; i < len; i++) str += String.fromCharCode(data.getUint8(offset++));
    return str;
  }

  if (readString(4) !== "MThd") { toast("Invalid MIDI file structure!"); return; }
  offset += 4;
  const format = data.getUint16(offset); offset += 2;
  const tracksCount = data.getUint16(offset); offset += 2;
  const division = data.getUint16(offset); offset += 2;

  let allNotes = [];

  for (let track = 0; track < tracksCount; track++) {
    if (offset >= data.byteLength) break;
    if (readString(4) !== "MTrk") break;
    const trackLen = data.getUint32(offset); offset += 4;
    const trackEnd = offset + trackLen;

    let absoluteTicks = 0;
    let runningStatus = 0;

    while (offset < trackEnd) {
      let delta = 0;
      while (true) {
        let byte = data.getUint8(offset++);
        delta = (delta << 7) | (byte & 0x7F);
        if (!(byte & 0x80)) break;
      }
      absoluteTicks += delta;

      let status = data.getUint8(offset);
      if (status & 0x80) {
        runningStatus = status;
        offset++;
      } else {
        status = runningStatus;
      }

      const command = status & 0xF0;
      if (command === 0x90) {
        const pitch = data.getUint8(offset++);
        const vel = data.getUint8(offset++);
        if (vel > 0) allNotes.push({ pitch, ticks: absoluteTicks });
      } else if (command === 0x80) {
        offset += 2;
      } else if (status === 0xFF) {
        offset++;
        let metaLen = 0;
        while (true) {
          let b = data.getUint8(offset++);
          metaLen = (metaLen << 7) | (b & 0x7F);
          if (!(b & 0x80)) break;
        }
        offset += metaLen;
      } else {
        offset += 2;
      }
    }
  }

  if (!allNotes.length) { toast("No playable notes found."); return; }

  allNotes.sort((a,b) => a.ticks - b.ticks);
  let parsedBlocks = [], currentGroup = [], lastTicks = -1;

  allNotes.forEach(n => {
    if (lastTicks < 0 || Math.abs(n.ticks - lastTicks) < (division / 2)) {
      currentGroup.push(n.pitch);
    } else {
      if (currentGroup.length) {
        const unique = Array.from(new Set(currentGroup)).sort((a,b)=>a-b);
        const rootNoteName = NOTE_NAMES[unique[0] % 12];
        parsedBlocks.push({ roman: "Imported (" + rootNoteName + ")", notes: unique, imported: true });
      }
      currentGroup = [n.pitch];
    }
    lastTicks = n.ticks;
  });

  if (currentGroup.length) {
    const unique = Array.from(new Set(currentGroup)).sort((a,b)=>a-b);
    const rootNoteName = NOTE_NAMES[unique[0] % 12];
    parsedBlocks.push({ roman: "Imported (" + rootNoteName + ")", notes: unique, imported: true });
  }

  blocks = parsedBlocks;
  renderArrangement();
  toast("Imported " + blocks.length + " Chords!");
}

/* ---------- Audio Engine ---------- */
function createReverbImpulse(ctx) {
  const rate = ctx.sampleRate, length = rate * 2.2, impulse = ctx.createBuffer(2, length, rate);
  for (let c = 0; c < 2; c++) {
    const data = impulse.getChannelData(c);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.5);
    }
  }
  return impulse;
}

async function enableAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error("Web Audio not supported.");
    if(!audioCtx){
      audioCtx=new AC();
      master=audioCtx.createGain(); master.gain.value = 0.7;
      
      reverbNode = audioCtx.createConvolver();
      reverbNode.buffer = createReverbImpulse(audioCtx);
      const wetGain = audioCtx.createGain(); wetGain.gain.value = 0.25;
      
      reverbNode.connect(wetGain); wetGain.connect(audioCtx.destination);
      master.connect(audioCtx.destination); master.connect(reverbNode);
    }
    if(audioCtx.state!=="running")await audioCtx.resume();
    $("audioStatus").textContent="Audio Active";$("audio").textContent="Audio Ready";$("audio").disabled=true;$("play").disabled=!blocks.length;toast("Audio Ready");
  }catch(e){toast(e.message)}
}

function hz(n){return 440*Math.pow(2,(n-69)/12)}

function playPolyNote(note, time, dur, velocity=0.7, style="legato") {
  if (!audioCtx || muted[0]) return;
  const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
  const filter = audioCtx.createBiquadFilter(), gain = audioCtx.createGain();

  const jitter = (Math.random() - 0.5) * 0.006;
  time = Math.max(audioCtx.currentTime, time + jitter);

  let attack = 0.02, cutoff = 1800;
  if (style === "staccato") { dur = Math.min(dur, 0.18); attack = 0.004; cutoff = 2600; }
  else if (style === "strum") { attack = 0.012; cutoff = 2200; }
  else if (style === "arp") { attack = 0.006; cutoff = 2100; }

  o1.type = "sine"; o1.frequency.setValueAtTime(hz(note), time);
  o2.type = "triangle"; o2.frequency.setValueAtTime(hz(note) * 2, time);

  filter.type = "lowpass";
  filter.frequency.setValueAtTime(cutoff * velocity, time);
  filter.frequency.exponentialRampToValueAtTime(200, time + dur);

  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.linearRampToValueAtTime(0.12 * velocity, time + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

  o1.connect(filter); o2.connect(filter);
  filter.connect(gain); gain.connect(master);

  o1.start(time); o2.start(time);
  o1.stop(time + dur + 0.05); o2.stop(time + dur + 0.05);
}

function playSubBass(note, time, dur, velocity=0.8) {
  if (!audioCtx || muted[1]) return;
  const sub = audioCtx.createOscillator(), gain = audioCtx.createGain();
  sub.type = "sine";
  sub.frequency.setValueAtTime(hz(note), time);

  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.linearRampToValueAtTime(0.28 * velocity, time + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

  sub.connect(gain); gain.connect(master);
  sub.start(time); sub.stop(time + dur + 0.05);
}

function playPercussion(time, velocity=0.7) {
  if (!audioCtx || muted[3]) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(120, time);
  osc.frequency.exponentialRampToValueAtTime(30, time + 0.14);
  gain.gain.setValueAtTime(0.35 * velocity, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
  osc.connect(gain).connect(master);
  osc.start(time); osc.stop(time + 0.16);
}

function triggerMeter(idx){
  const el=$("m"+idx);el.style.width="100%";
  setTimeout(()=>el.style.width="0",120);
}

/* ---------- Rhythmic Scheduler ---------- */
function scheduleBeat(beatIndex, time){
  if (!blocks.length) return;
  const totalBeats = blocks.length * 4;
  const currentBlockIdx = Math.floor((beatIndex % totalBeats) / 4);
  const blockBeat = beatIndex % 4;
  const block = blocks[currentBlockIdx];
  const spb = 60.0 / bpm;

  const style = $("articulation").value;
  const arpDir = $("arpPattern").value;
  const swingPct = Number($("swing").value) / 100.0;
  const strumSpeedMs = Number($("strumSpeed").value) / 1000.0;

  let swingOffset = 0;
  if (blockBeat % 1 !== 0) { swingOffset = (spb * 0.5) * (swingPct * 0.4); }
  const adjustedTime = time + swingOffset;

  const chordPitches = block.notes.slice(1);
  const bassPitch = block.notes[0] || (chordPitches[0] ? chordPitches[0] - 24 : 36);

  const isAccent = (blockBeat === 0 || blockBeat === 2);
  const baseVelocity = isAccent ? 0.85 : 0.62;

  if (style === "arp") {
    let pitchList = [...chordPitches];
    if (arpDir === "down") pitchList.reverse();
    else if (arpDir === "updown") pitchList = pitchList.concat([...pitchList].reverse().slice(1,-1));
    else if (arpDir === "random") pitchList.sort(() => Math.random() - 0.5);

    for (let sub = 0; sub < 4; sub++) {
      const subTime = adjustedTime + (sub * (spb / 4));
      const subVel = (sub === 0) ? baseVelocity : baseVelocity * (0.65 + Math.random() * 0.2);
      const pitch = pitchList[(Math.floor(beatIndex * 4) + sub) % pitchList.length];
      if (pitch) playPolyNote(pitch, subTime, spb * 0.35, subVel, "arp");
    }
    triggerMeter(0);

  } else if (style === "strum") {
    if (isAccent) {
      const isUpstroke = (blockBeat === 2);
      const strumedNotes = isUpstroke ? [...chordPitches].reverse() : chordPitches;
      
      strumedNotes.forEach((n, idx) => {
        const strumDelay = Math.pow(idx, 1.1) * strumSpeedMs;
        const noteVel = baseVelocity * (1.0 - idx * 0.05);
        playPolyNote(n, adjustedTime + strumDelay, spb * 1.8, noteVel, "strum");
      });
      triggerMeter(0);
    }

  } else if (style === "staccato") {
    if (blockBeat % 1 === 0) {
      chordPitches.forEach((n) => {
        const vel = baseVelocity * (0.85 + Math.random() * 0.2);
        playPolyNote(n, adjustedTime, spb * 0.2, vel, "staccato");
      });
      triggerMeter(0);
    }

  } else {
    if (blockBeat === 0) {
      chordPitches.forEach((n, idx) => {
        const strumDelay = idx * 0.012;
        playPolyNote(n, adjustedTime + strumDelay, spb * 3.8, baseVelocity, "legato");
      });
      triggerMeter(0);
    }
  }

  if (blockBeat === 0 || blockBeat === 2.5) {
    playSubBass(bassPitch, adjustedTime, spb * 1.6, baseVelocity);
    triggerMeter(1);
  }

  if (blockBeat % 1 === 0 && Math.random() > 0.45 && chordPitches.length) {
    const melPitch = chordPitches[blockBeat % chordPitches.length] + 12;
    playPolyNote(melPitch, adjustedTime + (spb * 0.5), spb * 0.4, baseVelocity * 0.65, style);
    triggerMeter(2);
  }

  if (isAccent) playPercussion(adjustedTime, baseVelocity);
  triggerMeter(3);

  setTimeout(() => {
    $("playStatus").textContent = "Playing Block " + (currentBlockIdx + 1) + "/" + blocks.length;
  }, (time - audioCtx.currentTime) * 1000);
}

function scheduler(){
  while(nextNoteTime < audioCtx.currentTime + 0.1){
    scheduleBeat(currentBeat, nextNoteTime);
    nextNoteTime += (60.0 / bpm);
    currentBeat++;
  }
  schedulerTimer = window.setTimeout(scheduler, 25);
}

function start(){
  if(!audioCtx||audioCtx.state!=="running"){toast("Enable Audio Engine first!");return}
  if(!blocks.length){toast("Load or import a sequence first!");return}
  stop();
  isPlaying = true; currentBeat = 0;
  nextNoteTime = audioCtx.currentTime + 0.05;
  scheduler();
}

function stop(){
  if(schedulerTimer) clearTimeout(schedulerTimer);
  isPlaying = false; $("playStatus").textContent="Stopped";
}

/* ---------- Events ---------- */
$("audio").onclick=enableAudio;
$("play").onclick=start;
$("stop").onclick=stop;
$("clearBtn").onclick=clearTimeline;
$("exportBtn").onclick=exportMIDIFile;
$("importBtn").onclick=() => $("midiInput").click();
$("midiInput").onchange=function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => parseMIDIFile(evt.target.result);
  reader.readAsArrayBuffer(file);
};

$("rootKey").onchange=function(){ revoiceAll(); renderArrangement(); };
$("scaleMode").onchange=function(){ revoiceAll(); renderArrangement(); };
$("bpm").oninput=function(){bpm=Number(this.value);$("bpmText").textContent=bpm};
$("swing").oninput=function(){$("swingText").textContent=this.value+"%"};
$("strumSpeed").oninput=function(){$("strumText").textContent=this.value+"ms"};

document.querySelectorAll(".tracks button").forEach(b=>b.onclick=function(){
  const i=Number(this.dataset.track);muted[i]=!muted[i];this.textContent=muted[i]?"Unmute":"Mute";
});

window.addEventListener("pagehide",stop);
renderPresets();renderArrangement();
})();
</script>
